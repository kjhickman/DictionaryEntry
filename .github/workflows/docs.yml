name: Docs

on:
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy docs for (e.g. v0.4.1)
        required: true
        type: string

permissions:
  contents: read

# PRs: cancel superseded builds. Deploys: one shared queue so the newest release wins.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Docs track the stable package on NuGet; prereleases don't redeploy them.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || '' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build docs
        run: dotnet docfx docs/docfx.json --warningsAsErrors
        env:
          # Pin "View source" links to the released tag (empty on PRs = current branch).
          DOCFX_SOURCE_BRANCH_NAME: ${{ env.RELEASE_TAG }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
