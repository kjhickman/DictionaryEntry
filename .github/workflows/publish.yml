name: Publish NuGet Package

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.4.1)
        required: true
        type: string

jobs:
  build-and-publish:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Resolve package version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?$ ]]; then
            echo "::error::Expected a release tag like v0.4.1 or v0.4.1-rc.1."
            exit 1
          fi
          echo "PACKAGE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build --configuration Release -p:Version="$PACKAGE_VERSION"

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal -p:Version="$PACKAGE_VERSION"

      - name: Pack
        run: dotnet pack src/DictionaryEntry/DictionaryEntry.csproj --configuration Release --no-build --output ./nupkgs -p:Version="$PACKAGE_VERSION"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./nupkgs/*
          if-no-files-found: error

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: kjhickman

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
